<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maluti ERP</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="img/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2b2a6e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/icon-192.png">
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
  <script>
    // installable web / Android app: register the service worker when served over http(s) (not inside the desktop app)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !navigator.userAgent.includes('Electron'))
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
