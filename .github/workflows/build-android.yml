name: Build Android app

# Builds the Android APK (Capacitor shell that opens your Maluti ERP server) for every version,
# and attaches it to the GitHub release of that version when the release exists.
on:
  push:
    branches: [main, master]
    paths: ['mobile/**', 'package.json', '.github/workflows/build-android.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Version
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          IFS=. read -r A B C <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((A*10000 + B*100 + C))" >> "$GITHUB_OUTPUT"
      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#2b2a6e' --splashBackgroundColor '#eef0f6'
          npx cap sync android
          # version from package.json; allow plain http to shop PCs on the LAN
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.v.outputs.code }}/; s/versionName \"[^\"]*\"/versionName \"${{ steps.v.outputs.version }}\"/" android/app/build.gradle
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - name: Build (signed if keystore secrets exist)
        working-directory: mobile/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            ./gradlew assembleRelease
            APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out signed.apk "$APK"
            rm -f release.jks
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk signed.apk
          fi
          mv signed.apk "MalutiERP-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MalutiERP-android-${{ steps.v.outputs.version }}
          path: mobile/android/MalutiERP-*.apk
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            gh release upload "v${{ steps.v.outputs.version }}" mobile/android/MalutiERP-*.apk --clobber
          else echo "No release v${{ steps.v.outputs.version }} yet – the APK is in the workflow artifacts."; fi
